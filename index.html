<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Haz</title>
<meta name="description" content="fabric client made for anarchy">
<meta name="theme-color" content="#090608">
<meta property="og:type" content="website">
<meta property="og:title" content="Haz">
<meta property="og:description" content="fabric client made for anarchy">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090608'/%3E%3Ctext x='16' y='25' font-family='monospace' font-size='24' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EH%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #090608;
    --panel: #110c0f;
    --line: #261c21;
    --text: #f3eef0;
    --muted: #a1949a;
    --accent: #ffffff;
    --accent-hover: #e6e6e6;
    --on-accent: #14101c;
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--accent); color: var(--on-accent); }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  a:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent-hover);
    outline-offset: 3px;
  }

  .wrap {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ───────── NAV ───────── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 0;
  }

  .brand {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.5px;
    color: #ffffff;
    text-decoration: none;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-right > a {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: .4px;
  }

  .nav-right > a:hover { color: var(--text); }

  .langs { display: flex; }

  .lang {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-left: none;
    background: var(--panel);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    cursor: pointer;
  }

  .lang:first-child { border-left: 1px solid var(--line); }
  .lang:hover { color: var(--text); }

  .lang.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  /* ───────── HERO ───────── */
  .shot {
    margin: 18px 0 0;
    overflow-x: auto;
  }

  .shot img {
    display: block;
    width: 100%;
    min-width: 980px;
    height: auto;
  }

  .hero {
    text-align: center;
    padding: 56px 0 64px;
  }

  .hero h1 {
    margin: 0;
    font-size: 54px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -2px;
    color: #ffffff;
  }

  .tagline {
    margin: 14px auto 0;
    max-width: 520px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }

  .download {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 12px 28px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    text-decoration: none;
  }

  .download:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .version {
    display: block;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .4px;
  }

  .guide {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .4px;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }

  .guide:hover { color: var(--text); }

  /* ───────── FOOTER ───────── */
  footer {
    margin-top: 56px;
    padding: 22px 0 36px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .3px;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 16px;
  }

  footer a:first-child { margin-left: 0; }
  footer a:hover { color: var(--text); }

  @media (max-width: 720px) {
    .nav { flex-direction: column; align-items: flex-start; gap: 12px; }
    .nav-right { width: 100%; justify-content: space-between; gap: 14px; }
    .hero { padding: 40px 0 48px; }
    .hero h1 { font-size: 42px; }
    footer { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="./">Haz</a>
      <div class="nav-right">
        <a href="docs/">docs</a>
        <a href="https://github.com/piolunson/homovoreplus" target="_blank" rel="noopener">github</a>
        <div class="langs">
          <button class="lang" data-lang="en" type="button">EN</button>
          <button class="lang" data-lang="pl" type="button">PL</button>
          <button class="lang" data-lang="ru" type="button">RU</button>
        </div>
      </div>
    </nav>

    <section class="shot">
      <img src="gui.png" alt="Haz GUI" onerror="this.parentNode.remove()">
    </section>

    <header class="hero">
      <h1>Haz.</h1>
      <p class="tagline" data-i18n="tagline">fabric client made for anarchy</p>
      <a class="download" href="download/haz-1.1.75.jar" download>
        <span data-i18n="download">↓ download</span>
      </a>
      <span class="version" data-i18n="version">1.1.75 · fabric 1.21.11 · chat spammer · liquid hotbar · future+ gui</span>
      <a class="guide" href="docs/#/start" data-i18n="guide">install guide →</a>
    </header>


    <footer>
      <span>Haz · v1.1.75</span>
      <span>
        <a href="docs/">docs</a>
        <a href="https://github.com/piolunson/homovoreplus" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/piolunson" target="_blank" rel="noopener">piolunson</a>
      </span>
    </footer>
  </div>

<script>
  const I18N = {
    en: {
      tagline: "fabric client made for anarchy",
      download: "↓ download",
      version: "1.1.75 · fabric 1.21.11 · chat spammer · liquid hotbar · future+ gui",
      guide: "install guide →"
    },
    pl: {
      tagline: "klient fabric stworzony pod anarchię",
      download: "↓ pobierz",
      version: "1.1.75 · fabric 1.21.11 · chat spammer · liquid hotbar · future+ gui",
      guide: "jak zainstalować →"
    },
    ru: {
      tagline: "fabric клиент, созданный для анархии",
      download: "↓ скачать",
      version: "1.1.75 · fabric 1.21.11 · chat spammer · liquid hotbar · future+ gui",
      guide: "как установить →"
    }
  };

  const STORAGE_KEY = "homovore-lang";
  const DEFAULT_LANG = "en";

  function detectLanguage() {
    const nav = (navigator.language || "").slice(0, 2).toLowerCase();
    return I18N[nav] ? nav : DEFAULT_LANG;
  }

  function applyLanguage(lang) {
    const dict = I18N[lang] || I18N[DEFAULT_LANG];
    document.documentElement.lang = I18N[lang] ? lang : DEFAULT_LANG;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      const value = dict[el.getAttribute("data-i18n")];
      if (value !== undefined) el.innerHTML = value;
    });

    document.querySelectorAll(".lang").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === document.documentElement.lang);
    });

    try { localStorage.setItem(STORAGE_KEY, document.documentElement.lang); } catch (e) {}
  }

  function initLanguage() {
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    applyLanguage(I18N[saved] ? saved : detectLanguage());

    document.querySelectorAll(".lang").forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyLanguage(btn.getAttribute("data-lang"));
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initLanguage);
  } else {
    initLanguage();
  }
</script>
</body>
</html>
